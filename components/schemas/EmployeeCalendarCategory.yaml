type: object
properties:
  id:
    type: integer
    description: Id of the calendar category. Use this as `categoryId` when writing calendar entries.
    example: 12
  name:
    type: string
    description: Name of the category
    example: Sick leave
  type:
    type: string
    enum:
      - absence
      - availability
      - activity
    description: |
      The kind of entries the category produces. The type decides which rules apply when writing entries:
      overlapping entries are rejected for `absence` and `availability`, but allowed for `activity`.
    example: absence
  color:
    type: string    
    description: |
      The color used to display this category
    example: #60d935
  isPayable:
    type: boolean    
    description: |
      Whether this category represents a payable absence
    example: true
