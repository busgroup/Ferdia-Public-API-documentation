properties:
  order_id:
    type: string
    description: "The unique internal order ID"
    example: "3714"
  status:
    type: string
    description: "The status of the order"
    example: "active order"
  trips:
    type: object
    description: "A map of trip references to their status"
    additionalProperties:
      $ref: "./OrderStatusTrip.yaml"
    example:
      BS-002960-S01-N001:
        status: "planning"