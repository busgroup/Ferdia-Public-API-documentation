servers:
  - url: https://api.ferdia.app/v1/publicapi/
    description: Production server
  - url: https://staging.api.ferdia.app/v1/publicapi
    description: Staging server (includes preview endpoints not yet available in production)

tags:
  - name: Trips
    description: Query live trip data - fetch trip lists, trip details, and the current status of trips on the road.
  - name: Customers
    description: Create, update, and look up customers, including their addresses, contact persons, and fixed-trip pricing info.
  - name: Customer-categories
    description: Manage the customer categories used to group and price customers.
  - name: Requests
    description: Submit new trip requests, either for an existing customer or together with new customer details.
  - name: Orders
    description: Create orders, add trips to existing orders, and track order and order-confirmation status.
  - name: Capacity
    description: Check available vehicle capacity for a given time range and department.
  - name: Price
    description: Calculate trip prices ahead of creating a request or order.
  - name: Vehicles
    description: Look up the vehicle fleet available in the TEQ platform.
  - name: Employees
    description: Look up employees and their calendar and availability entries.
  - name: Settings
    description: Retrieve platform-level configuration, such as the available trip types.
  - name: Products
    description: Look up additional products and items that can be billed on trips and orders.
  - name: Departments
    description: Manage departments and their hierarchy.
  - name: Garages
    description: Manage garages and their locations.
  - name: Changelog
    x-traitTag: true
    description:
      $ref: './components/changelog.yaml#/description'

x-tagGroups:
  - name: Operations
    tags:
      - Trips
  - name: Sales
    tags:
      - Customers
      - Customer-categories
      - Requests
      - Orders
      - Capacity
      - Price
  - name: Core
    tags:
      - Vehicles
      - Employees
      - Settings
      - Products
      - Departments
      - Garages
  - name: Changelog
    tags:
      - Changelog

