openapi: 3.0.0
info:
  version: "1.0"
  title: TEQ Public API
  x-logo:
    url: 'https://raw.githubusercontent.com/busgroup/Ferdia-Public-API-documentation/main/Ferdia-logo.png'
    backgroundColor: '#FFFFFF'
    altText: 'TEQ Logo'
  description: >
    # Introduction

    [comment]: <> (x-product-description-placeholder)

    With the TEQ API you can integrate your system with the TEQ platform. The API is designed to be easy to use and to provide a seamless integration experience.


    The TEQ API is built on HTTP and is RESTful.

    It has predictable resource URLs and returns HTTP response codes to indicate
    errors.

    It also accepts and returns JSON in the HTTP body.

    Use your favorite HTTP/REST library in your programming language when using
    this API.

    This API reference documentation contains the most commonly integrated
    resources.

    # Authentication

    The API uses OAuth2 for authentication. You will need to obtain an access token to use the API.
    The access token should be included in the Authorization header of each request.

    You can create your own access credentials directly in the TEQ application: go to **Settings > Integrations > Public API Clients** and create a new client.

    ## OAuth 2.0 flow

    The Authentication supports OAuth 2.0 Client Credentials flow

    ## Authentication-endpoints:

    Token-endpoint: **https://auth.api.ferdia.app/oauth2/token**

    # Domain-header

    For all API requests an HTTP-header `domain` must be included. This header should contain the domain/company name that the API-call should be directed to. 
    You will receive this domain name when you sign up for the TEQ API.

    # TimeZone
    
    The API uses the timezone of the client of the request to calculate dates and times. The timezone should be included in the HTTP-header `TimeZone` in the format `Continent/City` (e.g. `Europe/Berlin`).

servers:
  - url: https://api.ferdia.app/v1/publicapi/
    description: Production server
  - url: https://staging.api.ferdia.app/v1/publicapi
    description: Staging server (includes preview endpoints not yet available in production)

tags:
  - name: Trips
    description: Query live trip data - fetch trip lists, trip details, and the current status of trips on the road.
  - name: Customers
    description: Create, update, and look up customers, including their addresses, contact persons, and fixed-trip pricing info.
  - name: Customer-categories
    description: Manage the customer categories used to group and price customers.
  - name: Requests
    description: Submit new trip requests, either for an existing customer or together with new customer details.
  - name: Orders
    description: Create orders, add trips to existing orders, and track order and order-confirmation status.
  - name: Capacity
    description: Check available vehicle capacity for a given time range and department.
  - name: Price
    description: Calculate trip prices ahead of creating a request or order.
  - name: Vehicles
    description: Look up the vehicle fleet available in the TEQ platform.
  - name: Employees
    description: Look up employees and their calendar and availability entries.
  - name: Settings
    description: Retrieve platform-level configuration, such as the available trip types.
  - name: Products
    description: Look up additional products and items that can be billed on trips and orders.

x-tagGroups:
  - name: Operations
    tags:
      - Trips
  - name: Sales
    tags:
      - Customers
      - Customer-categories
      - Requests
      - Orders
      - Capacity
      - Price
  - name: Core
    tags:
      - Vehicles
      - Employees
      - Settings
      - Products

paths:
  # Operations/Trips
  /trips/trips:
    $ref: './paths/operations-trips.yaml#/~1trips~1trips'
  /trips/trips/{id}:
    $ref: './paths/operations-trips.yaml#/~1trips~1trips~1{id}'
  /trips/tripstatus/{id}:
    $ref: './paths/operations-trips.yaml#/~1trips~1tripstatus~1{id}'
  
  # Sales/Customers
  /sales/customers:
    $ref: './paths/sales-customers.yaml#/~1sales~1customers'
  /sales/customers/{id}:
    $ref: './paths/sales-customers.yaml#/~1sales~1customers~1{id}'
  /sales/customers/{id}/fixedtripsinfo:
    $ref: './paths/sales-customers.yaml#/~1sales~1customers~1{id}~1fixedtripsinfo'

  # Sales/Customer-categories
  /sales/customer-categories:
    $ref: './paths/sales-customers.yaml#/~1sales~1customer-categories'
  /sales/customer-categories/{id}:
    $ref: './paths/sales-customers.yaml#/~1sales~1customer-categories~1{id}'
  
  # Sales/Requests
  /sales/requests:
    $ref: './paths/sales-requests.yaml#/~1'
  /sales/requests/{customerId}:
    $ref: './paths/sales-requests.yaml#/~1sales~1requests~1{customerId}'
  
  # Sales/Orders
  /sales/orders:
    $ref: './paths/sales-orders.yaml#/~1sales~1orders'
  /sales/orders/{customerId}:
    $ref: './paths/sales-orders.yaml#/~1sales~1orders~1{customerId}'
  /sales/orders/status/{id}:
    $ref: './paths/sales-orders.yaml#/~1sales~1orders~1status~1{id}'
  /sales/orders/orderConfirmation/{id}:  
    $ref: './paths/sales-orders.yaml#/~1sales~1orders~1orderConfirmation~1{id}'
  /sales/orders/addtrip/{id}:
    $ref: './paths/sales-orders.yaml#/~1sales~1orders~1addtrip~1{id}'
  
  # Sales/Capacity
  /sales/capacity:
    $ref: './paths/sales-capacity.yaml#/~1sales~1capacity'

  # Sales/Price
  /sales/price/calculateTripPrice:
    $ref: './paths/sales-price.yaml#/~1sales~1price~1calculateTripPrice'

  # Core/Vehicles
  /core/vehicles:
    $ref: './paths/core-vehicles.yaml#/~1core~1vehicles'
  
  # Core/Employees
  /core/employees:
    $ref: './paths/core-employees.yaml#/~1core~1employees'
  /core/employees/calendar/{id}:
    $ref: './paths/core-employees.yaml#/~1core~1employees~1calendar~1{id}'
  
  # Core/Settings
  /core/settings/triptypes:
    $ref: './paths/core-settings.yaml#/~1core~1settings~1triptypes'

  # Core/Products
  /core/products:
    $ref: './paths/core-products.yaml#/~1core~1products'

security:
  - OAuth2: []

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials flow. The scopes listed below are
        granted to your client in **Settings > Integrations > Public API Clients**;
        each endpoint requires one specific scope, shown under its "Authorizations" section.
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.ferdia.app/oauth2/token
          scopes:
            vehicles_read: Read access to vehicles
            employees_read: Read access to employees and their calendar entries
            triptypes_read: Read access to trip type settings
            products_read: Read access to products
            requests_read: Read access to sales capacity
            requests_write: Create sales requests
            orders_read: Read access to orders and order status
            orders_write: Create orders and add trips to existing orders
            prices_read: Calculate trip prices
            customers_read: Read access to customers and customer categories
            customers_write: Create and update customers and customer categories
            fixedtrips_read: Read access to a customer's fixed trips info
            trips_read: Read access to trips and trip status

  responses:    
    404_notFound:
      $ref: './components/responses/404.yaml'
    400_requestError:
      $ref: './components/responses/400.yaml'
  
  parameters:
    domainParameter:
      $ref: './components/parameters/domain.yaml'
    timezoneParameter:
      $ref: './components/parameters/timezone.yaml'

  schemas:
    # Customer related schemas
    CustomerType:
      $ref: './components/schemas/CustomerType.yaml'
    Address:
      $ref: './components/schemas/Address.yaml'
    CustomerAddress:
      $ref: './components/schemas/CustomerAddress.yaml'
    ContactPerson:
      $ref: './components/schemas/ContactPerson.yaml'
    NewContactPerson:
      $ref: './components/schemas/NewContactPerson.yaml'
    CustomerCategory:
      $ref: './components/schemas/CustomerCategory.yaml'
    PostCustomerCategory:
      $ref: './components/schemas/PostCustomerCategory.yaml'
    PutCustomerCategory:
      $ref: './components/schemas/PutCustomerCategory.yaml'
    Customer:
      $ref: './components/schemas/Customer.yaml'
    PostCustomer:
      $ref: './components/schemas/PostCustomer.yaml'
    PutCustomer:
      $ref: './components/schemas/PutCustomer.yaml'
    CustomerFixedTripInfo:
      $ref: './components/schemas/CustomerFixedTripInfo.yaml' 
    CustomerList:
      $ref: './components/schemas/CustomerList.yaml'      
    
    # Trip related schemas
    GeoLocation:
      $ref: './components/schemas/GeoLocation.yaml'
    Location:
      $ref: './components/schemas/Location.yaml'
    ViaPoint:
      $ref: './components/schemas/ViaPoint.yaml'
    Garage:
      $ref: './components/schemas/Garage.yaml'
    TripExecution:
      $ref: './components/schemas/TripExecution.yaml'
    TripListEntry:
      $ref: './components/schemas/TripListEntry.yaml'
    Trip:
      $ref: './components/schemas/Trip.yaml'
    TripList:
      $ref: './components/schemas/TripList.yaml'
    TripStatus:
      $ref: './components/schemas/TripStatus.yaml'
    TripType:
      $ref: './components/schemas/TripType.yaml'
    PostTrip:
      $ref: './components/schemas/PostTrip.yaml'
    
    # Request/Order related schemas
    RequestSource:
      $ref: './components/schemas/RequestSource.yaml'
    PostRequestGivenCustomer:
      $ref: './components/schemas/PostRequestGivenCustomer.yaml'
    PostRequest:
      $ref: './components/schemas/PostRequest.yaml'
    Request:
      $ref: './components/schemas/Request.yaml'
    Quotation:
      $ref: './components/schemas/Quotation.yaml'
    Order:
      $ref: './components/schemas/Order.yaml'
    PostOrder:
      $ref: './components/schemas/PostOrder.yaml'
    OrderStatus:
      $ref: './components/schemas/OrderStatus.yaml'
    OrderStatusTrip:
      $ref: './components/schemas/OrderStatusTrip.yaml'
    
    # Sales/Capacity
    SalesCapacity:
