security:
  - OAuth2: []

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >
        OAuth 2.0 Client Credentials flow. The scopes listed below are
        granted to your client in **Settings > Integrations > Public API Clients**;
        each endpoint requires one specific scope, shown under its "Authorizations" section.
      flows:
        clientCredentials:
          tokenUrl: https://auth.api.ferdia.app/oauth2/token
          scopes:
            vehicles_read: Read access to vehicles
            employees_read: Read access to employees and their calendar entries
            triptypes_read: Read access to trip type settings
            products_read: Read access to products
            requests_read: Read access to sales capacity
            requests_write: Create sales requests
            orders_read: Read access to orders and order status
            orders_write: Create orders and add trips to existing orders
            prices_read: Calculate trip prices
            customers_read: Read access to customers and customer categories
            customers_write: Create and update customers and customer categories
            fixedtrips_read: Read access to a customer's fixed trips info
            trips_read: Read access to trips and trip status

  responses:    
    404_notFound:
      $ref: './components/responses/404.yaml'
    400_requestError:
      $ref: './components/responses/400.yaml'
  
  parameters:
    domainParameter:
      $ref: './components/parameters/domain.yaml'
    timezoneParameter:
      $ref: './components/parameters/timezone.yaml'

  schemas:
    # Customer related schemas
    CustomerType:
      $ref: './components/schemas/CustomerType.yaml'
    Address:
      $ref: './components/schemas/Address.yaml'
    CustomerAddress:
      $ref: './components/schemas/CustomerAddress.yaml'
    ContactPerson:
      $ref: './components/schemas/ContactPerson.yaml'
    NewContactPerson:
      $ref: './components/schemas/NewContactPerson.yaml'
    CustomerCategory:
      $ref: './components/schemas/CustomerCategory.yaml'
    PostCustomerCategory:
      $ref: './components/schemas/PostCustomerCategory.yaml'
    PutCustomerCategory:
      $ref: './components/schemas/PutCustomerCategory.yaml'
    Customer:
      $ref: './components/schemas/Customer.yaml'
    PostCustomer:
      $ref: './components/schemas/PostCustomer.yaml'
    PutCustomer:
      $ref: './components/schemas/PutCustomer.yaml'
    CustomerFixedTripInfo:
      $ref: './components/schemas/CustomerFixedTripInfo.yaml' 
    CustomerList:
      $ref: './components/schemas/CustomerList.yaml'      
    
    # Trip related schemas
    GeoLocation:
      $ref: './components/schemas/GeoLocation.yaml'
    Location:
      $ref: './components/schemas/Location.yaml'
    ViaPoint:
      $ref: './components/schemas/ViaPoint.yaml'
    Garage:
